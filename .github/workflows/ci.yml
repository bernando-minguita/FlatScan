name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # The runner has no display; the suite only needs the offscreen plugin.
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q app core database services ui workers main.py

      - name: Run the test suite
        # Qt worker threads can outlive the interpreter on Windows, so the
        # bundled runner executes one file per process with a timeout.
        timeout-minutes: 25
        run: python tools/run_tests.py

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest_out.txt
          if-no-files-found: ignore

  imports:
    name: Import smoke check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import every package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import app, core, database, services, ui, workers, main; assert callable(main.main); print('imports OK')"
